# Local development databases. Production (phase 11) runs on AWS managed
# services; staging (phase 2) reuses this file extended with app services.
name: unghosted

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unghosted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unghosted}
      POSTGRES_DB: ${POSTGRES_DB:-unghosted}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ stores data in major-version subdirectories under
      # /var/lib/postgresql; mounting at /data breaks the new layout.
      - postgres-data:/var/lib/postgresql
      # Creates the `app` and `auth` schemas on a fresh volume.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-unghosted} -d ${POSTGRES_DB:-unghosted}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-unghosted}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-unghosted}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      # SMTP for the app (UNGHOSTED_SMTP_HOST/PORT), HTTP is the inbox UI.
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"

volumes:
  postgres-data:
  mongo-data:
