StylesPath = styles
MinAlertLevel = warning
# Downloaded into StylesPath by `vale sync` — not vendored.
Packages = Microsoft

[*.md]
BasedOnStyles = de-blab, write-good, Microsoft
# Disabled — misfits for this repo:
# Dashes: French typography spaces em dashes on purpose.
Microsoft.Dashes = NO
# We: matches "US-n" user-story ids, not first-person plural.
Microsoft.We = NO
# HeadingAcronyms: KPI/API/GDPR belong in technical headings.
Microsoft.HeadingAcronyms = NO
# GeneralURL: "URL" is the correct technical term here.
Microsoft.GeneralURL = NO
# Passive: acceptance criteria legitimately use "is stored" forms.
write-good.Passive = NO
# Auto: "auto-reply" is a core domain term (reply_type = auto).
Microsoft.Auto = NO
# FirstPerson: user stories are written as "As a visitor I …".
Microsoft.FirstPerson = NO
# UIVerbs: "click" is the deliberate product term for explicit per-email approval.
Microsoft.UIVerbs = NO
# Foreign: French labels (Étude de cas) are intentional template data.
Microsoft.Foreign = NO

[node_modules/**]
BasedOnStyles =

# Local tooling caches — never lint.
[**/.venv/**]
BasedOnStyles =

[**/.pytest_cache/**]
BasedOnStyles =

[apps/web/.temp/**]
BasedOnStyles =

# Local-only design notes (git-excluded) — not part of the repo.
[design.md]
BasedOnStyles =
