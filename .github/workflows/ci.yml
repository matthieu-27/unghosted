name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web (biome, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      # setup-uv publishes immutable releases since v8: pin the exact version.
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest

  audit:
    name: dependency audit (pip-audit, bun audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Python dependencies
        run: |
          cd apps/api
          uv export --frozen --no-emit-project -o requirements.txt
          uvx pip-audit -r requirements.txt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Web dependencies
        run: |
          cd apps/web
          bun install --frozen-lockfile
          bun audit
