# Pre-commit gate — brief section 9.1.
# Install: uv tool install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# Web checks run Biome (root biome.json) via apps/web package.json scripts.
repos:
  # File hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^img/
      - id: trailing-whitespace
        exclude: ^img/
      - id: check-added-large-files
        # Design source binaries (Penpot exports) are intentionally stored
        # and exceed the default 500 KB cap.
        exclude: ^docs/files/

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python lint + format (config in apps/api/pyproject.toml [tool.ruff])
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Python type check — strict is the project baseline (brief 9.1).
  # Local hook: mypy resolves the src/ layout and config from apps/api,
  # which a root-cwd mirrors-mypy invocation cannot do.
  - repo: local
    hooks:
      - id: api-typecheck
        name: api typecheck (mypy --strict)
        entry: bash -c 'cd apps/api && uv run mypy src tests'
        language: system
        pass_filenames: false
        files: ^apps/api/.*\.py$

  # Web: tsc strict + Biome (lint, format, imports) via the app's own scripts
  - repo: local
    hooks:
      - id: web-typecheck
        name: web typecheck (tsc --noEmit)
        entry: bash -c 'cd apps/web && bun run typecheck'
        language: system
        pass_filenames: false
        files: ^apps/web/
        types_or: [ts, tsx]
      - id: web-check
        name: web check (biome)
        entry: bash -c 'cd apps/web && bun run check'
        language: system
        pass_filenames: false
        files: ^apps/web/
        types_or: [ts, tsx, javascript, jsx, css, json]
